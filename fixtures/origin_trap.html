<meta charset="utf-8">
<title>fixture: origin_trap</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:#f6f7f9; color:#111 }
  .label { position:fixed; bottom:0; left:0; width:100%; padding:10px 16px;
           box-sizing:border-box; background:#111; color:#fff; font-size:13px }
  /* Deliberately occupies the exact origin. Nothing else may sit here. */
  #decoy  { position:absolute; left:0; top:0; width:200px; height:120px;
            background:#fff; border:1px solid #d3d7de;
            display:flex; align-items:center; justify-content:center; font-size:20px }
  #target { position:absolute; left:900px; top:500px; width:300px; height:140px;
            font-size:24px; background:#1a56db; color:#fff; border:none; border-radius:8px }
</style>
<script>
  // Provokes FINDINGS bug 3, the worst of the five: a malformed coordinate fell
  // back to 0, so the agent clicked the top-left corner. (0, 0) is a PLAUSIBLE
  // click -- it usually lands on a logo or nav element and produces a real page
  // change the model then has to explain, with no error anywhere in the trace.
  //
  // The criterion requires the target hit AND the origin untouched, so a run
  // that stumbles into the corner cannot pass by accident.
  window.__probe = { targetHit: false, originHit: false };
</script>
<body>
  <div id="decoy" onclick="window.__probe.originHit = true">Home</div>
  <button id="target" onclick="window.__probe.targetHit = true">Publish</button>
  <div class="label">fixture: origin_trap</div>
</body>
