<meta charset="utf-8">
<title>fixture: drag_and_drop</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:#f6f7f9; color:#111 }
  .label { position:fixed; bottom:0; left:0; width:100%; padding:10px 16px;
           box-sizing:border-box; background:#111; color:#fff; font-size:13px }
  #source { position:absolute; left:200px; top:300px; width:160px; height:120px;
            background:#1a56db; color:#fff; border-radius:8px;
            display:flex; align-items:center; justify-content:center; font-size:20px }
  #zone   { position:absolute; left:1000px; top:300px; width:240px; height:240px;
            border:3px dashed #6b7280; border-radius:8px;
            display:flex; align-items:center; justify-content:center; font-size:20px }
</style>
<script>
  // Plain mouse events, not the HTML5 drag API: the executor drives
  // mouse.down / move / up, and this is what a real page built on pointer
  // handling would see. Requires press, travel, and release as three distinct
  // steps -- a click cannot satisfy it.
  window.__probe = { dragging: false, dropped: false };
</script>
<body>
  <div id="source">file</div>
  <div id="zone">drop here</div>
  <div class="label">fixture: drag_and_drop</div>
  <script>
    const source = document.getElementById('source');
    const zone = document.getElementById('zone');
    source.addEventListener('mousedown', () => { window.__probe.dragging = true });
    document.addEventListener('mouseup', (e) => {
      if (!window.__probe.dragging) return;
      const r = zone.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right &&
          e.clientY >= r.top && e.clientY <= r.bottom) {
        window.__probe.dropped = true;
        zone.textContent = 'file';
      }
      window.__probe.dragging = false;
    });
  </script>
</body>
